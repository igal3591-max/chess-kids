<!DOCTYPE html>
<html lang="he" dir="rtl">
<!-- PWA settings -->
<link rel="manifest" href="manifest.webmanifest">

<meta name="theme-color" content="#58cc02">

<link rel="icon"
      type="image/png"
      href="icons/chess-icon-192.png"><head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chess Kids</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<section id="welcome-screen" hidden>

    <img
        src="icons/chess-icon-512.png"
        alt="Chess Kids"
        width="180"
        height="180"
    >

    <h1 id="welcome-title">לומדים שחמט</h1>

    <h2 id="welcome-subtitle">תרגילי מט</h2>
<button id="welcome-language-button" type="button">
    English
</button>
    <button id="welcome-start-button" type="button">
        התחל
    </button>

</section>
    <header>
        <h1 id="app-title">בעיות שחמט למתחילים</h1>

        <button id="language-button" type="button">
            English
        </button>
    </header>

    <main>

        <h2 id="instruction">
            מצא מט במהלך אחד
        </h2>

        <div id="progress">
            תרגיל 1 מתוך 90
       </div>

<div class="progress-container"
     role="progressbar"
     aria-label="התקדמות בתרגילים"
     aria-valuemin="0"
     aria-valuemax="90"
     aria-valuenow="0">

    <div id="progress-bar"></div>

</div>
<button id="restart-button" type="button">
    התחל מחדש
</button><button id="group-button" type="button">
    בחירת קבוצת תרגילים
</button>
<!-- Puzzle group selection dialog -->
<div id="group-dialog" class="group-dialog" hidden>

    <div class="group-dialog-content">

        <h2 id="group-dialog-title">
            בחירת קבוצת תרגילים
        </h2>

        <div id="group-list"></div>

        <button id="group-cancel" type="button">
            ביטול
        </button>

    </div>

</div>
        <div id="chessboard"></div>

        <div id="message"
             role="status"
             aria-live="polite"></div>
<!-- Stage 1 completion screen -->
<section id="completion-screen" hidden>

    <div class="completion-content">

        <div class="completion-trophy">🏆</div>

        <h2 id="completion-title">
            כל הכבוד! אלופים בשחמט!
        </h2>

        <p id="completion-description">
            השלמתם בהצלחה את כל 90 התרגילים!
        </p>

        <div class="completion-score">
            90 / 90
        </div>

        <p id="completion-next-stage">
            השלב הבא: מט בשני מהלכים!
        </p>

        <button id="completion-groups-button" type="button">
            חזרה לבחירת קבוצות
        </button>

    </div>

</section>
    </main>

       <!-- Chess rules library -->
    <script src="./chess.min.js"></script>

    <!-- Application code --><!-- Pawn promotion window -->
<div id="promotion-dialog"
     class="promotion-dialog"
     role="dialog"
     aria-modal="true"
     aria-labelledby="promotion-title"
     hidden>

    <div class="promotion-box">

        <h2 id="promotion-title">
            בחר כלי להכתרה
        </h2>

        <div class="promotion-options">

            <button type="button"
                    class="promotion-choice"
                    data-promotion="q"
                    aria-label="Queen">
                ♕
            </button>

            <button type="button"
                    class="promotion-choice"
                    data-promotion="r"
                    aria-label="Rook">
                ♖
            </button>

            <button type="button"
                    class="promotion-choice"
                    data-promotion="b"
                    aria-label="Bishop">
                ♗
            </button>

            <button type="button"
                    class="promotion-choice"
                    data-promotion="n"
                    aria-label="Knight">
                ♘
            </button>

        </div>

        <button id="promotion-cancel" type="button">
            ביטול
        </button>

    </div>
</div>
    <script src="app.js"></script>

</body>
</html>
